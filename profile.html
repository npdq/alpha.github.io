<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>762.lol</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/profile.css">
</head>
<body>
  <div id="bg-container">
    <div id="bg-overlay" class="bg-overlay"></div>
  </div>
  <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>

  <div id="splash" class="splash">
    <div class="splash-inner">
      <div id="splash-text" class="splash-text">click to enter</div>
    </div>
  </div>

  <div id="volume-container" class="volume-container">
    <button id="volume-toggle" class="volume-toggle" aria-label="toggle sound">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70" aria-label="volume">
  </div>

  <div id="audio-panel" class="audio-panel">
    <div class="audio-controls">
      <button id="audio-prev" class="audio-btn audio-btn-secondary" aria-label="previous track">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="audio-play" class="audio-btn" aria-label="play/pause">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="audio-next" class="audio-btn audio-btn-secondary" aria-label="next track">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div class="audio-info">
      <div id="audio-title" class="audio-title"></div>
      <div class="audio-progress">
        <span id="audio-time-current">0:00</span>
        <div class="audio-bar"><div id="audio-bar-fill" class="audio-bar-fill"></div></div>
        <span id="audio-time-total">0:00</span>
      </div>
    </div>
    <audio id="audio-el" preload="metadata"></audio>
  </div>

  <main id="profile" class="profile-wrap" aria-hidden="true">
    <div id="card" class="card">
      <div id="card-header" class="card-header">
        <img id="avatar" class="avatar" alt="avatar">
        <div class="card-header-text">
          <div id="name-row" class="name-row">
            <span id="display-name" class="display-name"></span>
            <span id="badges" class="badges"></span>
          </div>
          <div id="title" class="title"></div>
          <div id="joined" class="joined"></div>
        </div>
      </div>
      <div id="bio" class="bio"></div>
      <div id="widgets" class="widgets"></div>
      <div id="links" class="links"></div>
      <div id="socials" class="socials"></div>
      <div id="meta" class="meta"></div>
    </div>
  </main>

  <div id="error-screen" class="error-screen" hidden>
    <h1>404</h1>
    <p id="error-message">user not found</p>
    <a href="/" class="error-back">back to 762.lol</a>
  </div>

  <script type="module" src="/profile.js"></script>
</body>
</html>
